<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Reminder App</title>
</head>
<body>
    <div class="form-container">
        <h2>New Call</h2>
        <form>
            <label>Image URL</label>
            <input required type="text" placeholder="https://example.com/photo.jpg" />
            
            <label>Full Name</label>
            <input required type="text" placeholder="Enter full name" />
            
            <label>Home Town</label>
            <input required type="text" placeholder="Enter home town" />
            
            <label>Purpose</label>
            <input required type="text" placeholder="e.g., Quick appointment note">
            
            <label>Category</label>
            <label class="tag-checkbox">
                <input required type="radio" name="category" value="emergency" />
                <span>Emergency</span>
            </label>
            
            <label class="tag-checkbox">
                <input required type="radio" name="category" value="important">
                <span>Important</span>
            </label>

            <label class="tag-checkbox">
                <input required type="radio" name="category" value="urgent">
                <span>Urgent</span>
            </label>

            <label class="tag-checkbox">
                <input required type="radio" name="category" value="no-rush">
                <span>No Rush</span>
            </label>

            <button type="submit" class=" submit-btn">Create Note</button>
        </form>
        <button class="closeForm">close</button>
    </div>
    <div class="note-container">
        <div class="left-icon">
            <button id="add-note"><i class="ri-add-line"></i></button>
            <button><i class="ri-arrow-up-line"></i></button>
            <button><i class="ri-arrow-up-down"></i></button>
        </div>

        <div class="stack">
            <div class="card">
            </div>
            <div class="card">
            </div>
            <div class="card">
            </div>
        </div>
        <div class="right-colors">
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
